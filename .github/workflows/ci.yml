name: CI (Test, Lint & Advanced Enterprise QA)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      # cargo test menjalankan unit test murni di src/main.rs (mod tests):
      # validasi nama paket, format_bytes, BuildDirGuard cleanup-on-drop, dll.
      - name: Check, Format & Unit Test
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo test --all-targets

  qa-advanced-enterprise:
    name: QA Advanced Enterprise Test (Full Feature Parity, AUR Helper & Safety Layer)
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    env:
      CARGO_HOME: /tmp/cargo-home
      CARGO_TARGET_DIR: /tmp/cargo-target

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            pacman-pkg-${{ runner.os }}-

      - name: Install System Dependencies
        run: |
          set -euo pipefail
          # pacman-contrib: supaya `checkupdates` tersedia untuk `atha update`.
          # python: server HTTP lokal buat simulasi curl/wget yang realistis.
          pacman -Sy --noconfirm --needed base-devel rustup git curl wget sudo yajl pacman-contrib python

      - name: Configure Rust toolchain
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          chmod -R 0777 "$CARGO_HOME" "$CARGO_TARGET_DIR"
          rustup default stable

      - name: Cache Cargo dependencies (shared CARGO_HOME)
        uses: actions/cache@v4
        with:
          path: |
            /tmp/cargo-home/registry
            /tmp/cargo-home/git
            /tmp/cargo-target
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-

      - name: Setup Non-Root Builder User
        run: |
          set -euo pipefail
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder /__w/Atha/Atha "$CARGO_HOME" "$CARGO_TARGET_DIR"

      # --- TAHAP 1: MULTI-VECTOR INSTALLATION (5 vektor) ---
      - name: QA Test All Installation Methods
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "[QA] Starting Multi-Vector Installation Testing"
          echo "===================================================="

          # Method 1: Source build
          su - builder -c "export PATH=\$HOME/.cargo/bin:\$PATH CARGO_HOME=$CARGO_HOME CARGO_TARGET_DIR=$CARGO_TARGET_DIR && rustup default stable && cd /__w/Atha/Atha && cargo build --release --locked"
          sudo install -Dm755 "$CARGO_TARGET_DIR/release/atha" /usr/local/bin/atha

          # Method 2: Local binary install
          atha --version

          # Method 3 & 3b: curl & wget lewat server HTTP lokal (lebih realistis
          # daripada file://, benar-benar lewat stack jaringan)
          mkdir -p /tmp/mock-releases/v3.1.1/
          cp "$CARGO_TARGET_DIR/release/atha" /tmp/mock-releases/v3.1.1/atha-x86_64-linux

          python -m http.server 8000 --directory /tmp/mock-releases &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          # Poll sampai server benar-benar siap, bukan blind sleep tetap
          for i in $(seq 1 20); do
            curl -sf "http://localhost:8000/v3.1.1/atha-x86_64-linux" -o /dev/null && break
            sleep 0.25
          done

          curl -sLo /usr/local/bin/atha-curl "http://localhost:8000/v3.1.1/atha-x86_64-linux"
          chmod +x /usr/local/bin/atha-curl
          atha-curl --version

          wget -qO /usr/local/bin/atha-wget "http://localhost:8000/v3.1.1/atha-x86_64-linux"
          chmod +x /usr/local/bin/atha-wget
          atha-wget --version

          kill $SERVER_PID 2>/dev/null || true

          # Method 4/5: makepkg (PKGBUILD) — juga memvalidasi source/checksum/
          # license install di PKGBUILD sungguhan
          su - builder -c "export CARGO_HOME=$CARGO_HOME CARGO_TARGET_DIR=$CARGO_TARGET_DIR && cd /__w/Atha/Atha && makepkg -si --noconfirm"
          pacman -Qi atha

          echo "[QA] All installation vectors passed!"

      # --- TAHAP 2: PACKAGING QA & DISTRIBUTION VALIDATION (NAMCAP) ---
      - name: QA Validate Package with Namcap & Lint
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "[QA] Starting Packaging & Distribution Validation (Namcap)"
          echo "===================================================="

          pacman -Sy --noconfirm --needed namcap
          PKG_FILE=$(find /__w/Atha/Atha -name "atha-*.pkg.tar.zst" ! -name "*-debug-*" | head -n1)

          if [ -f "$PKG_FILE" ]; then
            echo "[QA] Found built package: $PKG_FILE"

            echo "[QA] Running PKGBUILD lint check..."
            namcap_pkgbuild_rc=0
            namcap_pkgbuild_output="$(namcap PKGBUILD 2>&1)" || namcap_pkgbuild_rc=$?
            echo "$namcap_pkgbuild_output"
            if echo "$namcap_pkgbuild_output" | grep -qE '(^|[[:space:]])E:[[:space:]]'; then
              echo "[QA] Namcap found PKGBUILD ERROR(S) — failing CI."
              exit 1
            fi
            if [ "$namcap_pkgbuild_rc" -ne 0 ] && ! echo "$namcap_pkgbuild_output" | grep -qE '(^|[[:space:]])(W|E):[[:space:]]'; then
              echo "[QA] namcap failed to run against PKGBUILD (no diagnostics produced) — failing CI."
              exit 1
            fi

            echo "[QA] Running built package audit..."
            namcap_pkg_rc=0
            namcap_pkg_output="$(namcap "$PKG_FILE" 2>&1)" || namcap_pkg_rc=$?
            echo "$namcap_pkg_output"
            if echo "$namcap_pkg_output" | grep -qE '(^|[[:space:]])E:[[:space:]]'; then
              echo "[QA] Namcap found package ERROR(S) — failing CI."
              exit 1
            fi
            if [ "$namcap_pkg_rc" -ne 0 ] && ! echo "$namcap_pkg_output" | grep -qE '(^|[[:space:]])(W|E):[[:space:]]'; then
              echo "[QA] namcap failed to run against the built package (no diagnostics produced) — failing CI."
              exit 1
            fi
          else
            echo "[QA] Package file not found for namcap inspection — failing CI."
            exit 1
          fi

          echo "[QA] Packaging QA validation completed successfully!"

      # --- TAHAP 3: FULL CLI FEATURE & REGRESSION TEST SUITE ---
      - name: QA Test All CLI Commands, Modes & Known Regressions
        run: |
          set -uo pipefail   # tanpa -e: assertion helper di bawah yang menentukan pass/fail
          echo "===================================================="
          echo "[QA] Full CLI Feature & Regression Test Suite"
          echo "===================================================="

          FAILED=0

          assert_success() {
            local desc="$1"; shift
            if "$@" > /tmp/assert_out.log 2>&1; then
              echo "[PASS] $desc"
            else
              echo "[FAIL] $desc (exit=$?)"
              cat /tmp/assert_out.log
              FAILED=1
            fi
          }

          assert_failure() {
            local desc="$1"; shift
            if "$@" > /tmp/assert_out.log 2>&1; then
              echo "[FAIL] $desc (seharusnya gagal, tapi sukses)"
              cat /tmp/assert_out.log
              FAILED=1
            else
              echo "[PASS] $desc (gagal seperti yang diharapkan)"
            fi
          }

          # === Perintah dasar ===
          assert_success "atha --version" atha --version
          assert_success "atha --help" atha --help
          assert_success "atha (tanpa argumen, cetak HELP)" atha
          assert_success "atha doctor (lingkungan sehat)" atha doctor

          # === list: 4 varian + regresi issue #14 poin 2 ===
          assert_success "atha list installed" atha list installed
          assert_success "atha list explicit" atha list explicit
          assert_success "atha list aur" atha list aur
          assert_success "atha list all --limit 5" atha list all --limit 5

          full_count=$(pacman -Q | wc -l)
          atha_count=$(atha list installed --limit 1 | wc -l)
          if [ "$atha_count" -lt "$full_count" ]; then
            echo "[FAIL] 'list installed --limit 1' terpotong ($atha_count vs $full_count baris) — regresi issue #14 poin 2!"
            FAILED=1
          else
            echo "[PASS] 'list installed --limit' diabaikan sesuai desain ($atha_count baris)"
          fi
          all_lines=$(atha list all --limit 3 | wc -l)
          if [ "$all_lines" -gt 6 ]; then
            echo "[FAIL] 'list all --limit 3' seharusnya dipotong pendek, dapat $all_lines baris"
            FAILED=1
          else
            echo "[PASS] 'list all --limit' membatasi output ($all_lines baris)"
          fi

          assert_failure "'atha list --limit abc' (non-angka) ditolak clap" atha list installed --limit abc

          # === info & search: jalur official, AUR fallback, dan kegagalan ===
          assert_success "atha info pacman (official)" atha info pacman
          assert_failure "atha info nama tidak valid ditolak" atha info 'bad name!'
          # timeout eksplisit: nama fiktif ini membuat info/search jatuh ke
          # AUR RPC HTTP (jaringan nyata), yang sebelumnya tidak dibatasi —
          # kalau AUR API lambat, step bisa menggantung sampai job timeout.
          assert_failure "atha info paket yang sungguh tidak ada (official+AUR)" timeout 30 atha info definitely-nonexistent-pkg-xyz-987654
          assert_success "atha search curl (official)" atha search curl
          assert_failure "atha search term yang sungguh tidak ada (official+AUR)" timeout 30 atha search definitely-nonexistent-term-xyz-987654

          # === install/remove/update: --plan & --dry-run, jalur official ===
          assert_success "atha install --plan pacman (official)" atha install --plan pacman
          assert_success "atha install --dry-run pacman (official)" atha install --dry-run pacman
          assert_success "atha remove --plan non-existent-pkg-xyz" atha remove --plan non-existent-pkg-xyz
          assert_success "atha remove --dry-run non-existent-pkg-xyz" atha remove --dry-run non-existent-pkg-xyz
          assert_success "atha update --plan" atha update --plan
          assert_success "atha update --dry-run" atha update --dry-run

          # === install --plan/--dry-run: jalur AUR (paket fiktif, tidak dieksekusi) ===
          echo "[TRACE] Mulai uji jalur AUR (--plan/--dry-run, paket fiktif)..."
          assert_success "atha install --plan paket AUR fiktif (uji jalur AUR reachability)" timeout 30 atha install --plan definitely-nonexistent-aur-package-xyz-987654
          assert_success "atha install --dry-run paket AUR fiktif" timeout 30 atha install --dry-run definitely-nonexistent-aur-package-xyz-987654

          # === Regresi issue #14 poin 1: cancel = exit 0, BUKAN error ===
          echo "n" | atha remove pacman > /tmp/cancel_out.log 2>&1
          cancel_rc=$?
          if [ "$cancel_rc" -ne 0 ]; then
            echo "[FAIL] Membatalkan konfirmasi seharusnya exit 0, dapat exit=$cancel_rc — regresi issue #14 poin 1!"
            cat /tmp/cancel_out.log
            FAILED=1
          elif ! grep -q "Operation cancelled" /tmp/cancel_out.log; then
            echo "[FAIL] Pesan 'Operation cancelled' tidak ditemukan"
            FAILED=1
          else
            echo "[PASS] Membatalkan konfirmasi exit 0 secara graceful (issue #14 poin 1 terverifikasi)"
          fi

          echo "[TRACE] Mulai uji keamanan injeksi nama paket..."
          # === Keamanan: nama paket dengan shell-metacharacter tidak boleh
          #     tereksekusi sebagai command (defense-in-depth, bukan cuma
          #     "harus gagal" — dibuktikan literal tidak ada eksekusi command
          #     tersembunyi terjadi) ===
          INJECTION_MARKER="/tmp/should-not-be-created-$$"
          rm -f "$INJECTION_MARKER"
          timeout 15 atha install --yes "pkg; touch $INJECTION_MARKER" > /tmp/inject_out.log 2>&1
          inject_rc=$?
          if [ -f "$INJECTION_MARKER" ]; then
            echo "[FAIL] SECURITY: command injection berhasil membuat marker file! Validasi nama paket bocor."
            FAILED=1
          elif [ "$inject_rc" -eq 124 ]; then
            echo "[FAIL] atha TIMEOUT (15s) saat diberi nama paket berbahaya — bukan bukti ditolak, kemungkinan menggantung"
            cat /tmp/inject_out.log
            FAILED=1
          elif [ "$inject_rc" -eq 0 ]; then
            echo "[FAIL] Nama paket dengan shell-metacharacter seharusnya ditolak (exit != 0)"
            FAILED=1
          else
            echo "[PASS] Nama paket berbahaya ditolak dengan aman, tidak ada eksekusi command tersembunyi (exit=$inject_rc)"
          fi
          rm -f "$INJECTION_MARKER"

          echo "[TRACE] Mulai round-trip install/remove nyata (tree)..."
          # === Real execution round-trip (bukan cuma --plan/--dry-run) ===
          assert_success "atha install --yes tree (eksekusi nyata)" timeout 60 atha install --yes tree
          assert_success "'tree' benar-benar terpasang via pacman" pacman -Qi tree
          assert_success "atha remove --yes tree (eksekusi nyata)" timeout 60 atha remove --yes tree
          assert_failure "'tree' benar-benar terhapus via pacman" pacman -Qi tree

          echo "[TRACE] Mulai uji kegagalan install AUR (menyentuh jaringan aur.archlinux.org)..."
          # === Kegagalan instal AUR harus bersih: BuildDirGuard tidak boleh
          #     meninggalkan direktori build (regresi issue #14 poin 7).
          #     Pakai timeout eksplisit: ini satu-satunya titik di suite ini
          #     yang benar-benar menghubungi jaringan AUR nyata (git clone).
          #     Kalau jaringan lambat/menggantung, timeout ini yang membuat
          #     CI gagal dengan jelas (exit 124) alih-alih diam membisu
          #     sampai job timeout keseluruhan tercapai. ===
          BUILD_ROOT="${XDG_CACHE_HOME:-$HOME/.cache}/atha/build"
          before_count=0
          [ -d "$BUILD_ROOT" ] && before_count=$(find "$BUILD_ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)
          timeout 45 atha install --yes definitely-nonexistent-aur-package-xyz-987654 > /tmp/aur_fail_out.log 2>&1
          aur_fail_rc=$?
          if [ "$aur_fail_rc" -eq 124 ]; then
            echo "[FAIL] install paket AUR fiktif TIMEOUT (45s) — kemungkinan jaringan aur.archlinux.org lambat/menggantung"
            cat /tmp/aur_fail_out.log
            FAILED=1
          fi
          after_count=0
          [ -d "$BUILD_ROOT" ] && after_count=$(find "$BUILD_ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$aur_fail_rc" -eq 124 ]; then
            : # sudah dilaporkan [FAIL] di atas karena timeout — jangan dobel-lapor di sini
          elif [ "$aur_fail_rc" -eq 0 ]; then
            echo "[FAIL] install paket AUR fiktif seharusnya gagal, tapi sukses"
            cat /tmp/aur_fail_out.log
            FAILED=1
          elif [ "$after_count" -gt "$before_count" ]; then
            echo "[FAIL] direktori build AUR tertinggal setelah kegagalan clone (before=$before_count after=$after_count) — regresi BuildDirGuard!"
            FAILED=1
          else
            echo "[PASS] Kegagalan instal AUR ditangani rapi, tidak ada direktori build tersisa"
          fi

          echo "[TRACE] Mulai uji history (semua mode + filter)..."
          # === history: semua mode tampilan + filter, dan verifikasi ISI-nya ===
          assert_success "atha history --limit 10" atha history --limit 10
          assert_success "atha history --full --limit 10" atha history --full --limit 10
          assert_success "atha history --timeline --limit 10" atha history --timeline --limit 10
          assert_success "atha history --summary" atha history --summary
          assert_success "atha history --action install --limit 10" atha history --action install --limit 10
          assert_success "atha history --status success --limit 10" atha history --status success --limit 10

          if ! atha history --limit 20 | grep -q "tree"; then
            echo "[FAIL] Riwayat tidak mencatat operasi 'tree' yang baru saja dilakukan"
            FAILED=1
          else
            echo "[PASS] Riwayat mencatat operasi 'tree' dengan benar"
          fi

          echo "[TRACE] Mulai uji NO_COLOR..."
          # === NO_COLOR harus benar-benar polos tanpa escape code ===
          # PENTING: `atha list installed` cuma meneruskan mentah output
          # `pacman -Q` — tidak pernah lewat color()/info_msg()/success(),
          # jadi baris itu TIDAK PERNAH mengandung ANSI apa pun bahkan tanpa
          # NO_COLOR sama sekali. Cek terhadapnya akan selalu [PASS] secara
          # trivial, tidak pernah bisa menangkap regresi NO_COLOR beneran.
          # `atha doctor` dipakai sebagai gantinya karena benar-benar
          # memanggil success()/warn()/info_msg() yang diwarnai.
          #
          # Diuji DUA ARAH supaya assertion ini benar-benar bermakna: tanpa
          # NO_COLOR harus ADA escape code (kontrol positif — membuktikan
          # instrumennya bisa mendeteksi warna sama sekali), dan dengan
          # NO_COLOR=1 harus TIDAK ADA.
          if atha doctor 2>&1 | grep -qP '\x1b'; then
            echo "[PASS] Tanpa NO_COLOR, 'atha doctor' menghasilkan ANSI escape code (kontrol positif)"
          else
            echo "[FAIL] Tanpa NO_COLOR, 'atha doctor' TIDAK menghasilkan escape code sama sekali — instrumen uji tidak valid atau mode warna rusak"
            FAILED=1
          fi
          if NO_COLOR=1 atha doctor 2>&1 | grep -qP '\x1b'; then
            echo "[FAIL] NO_COLOR=1 tapi 'atha doctor' masih mengandung ANSI escape code"
            FAILED=1
          else
            echo "[PASS] NO_COLOR=1 menghasilkan output polos tanpa escape code"
          fi

          echo "[TRACE] Mulai uji doctor dengan git disembunyikan..."
          # === doctor: kasus TIDAK sehat (dependency beneran hilang) ===
          # Sebelumnya doctor cuma pernah diuji di jalur "semua OK" — cabang
          # missing_count>0 (yang membuat doctor exit non-zero) tidak pernah
          # benar-benar tereksekusi di CI manapun.
          sudo mv /usr/bin/git /usr/bin/git.ci-hidden
          trap 'sudo mv /usr/bin/git.ci-hidden /usr/bin/git 2>/dev/null || true' EXIT
          doctor_missing_output="$(atha doctor 2>&1)"
          doctor_missing_rc=$?
          sudo mv /usr/bin/git.ci-hidden /usr/bin/git
          trap - EXIT
          if [ "$doctor_missing_rc" -eq 0 ]; then
            echo "[FAIL] atha doctor seharusnya exit non-zero saat git hilang, dapat exit=0"
            FAILED=1
          elif ! echo "$doctor_missing_output" | grep -q "git missing"; then
            echo "[FAIL] atha doctor tidak melaporkan 'git missing' saat git memang hilang"
            FAILED=1
          else
            echo "[PASS] atha doctor mendeteksi dependency yang hilang dengan benar (git)"
          fi

          echo "===================================================="
          if [ "$FAILED" -ne 0 ]; then
            echo "[QA] SATU ATAU LEBIH TEST GAGAL — lihat [FAIL] di atas."
            exit 1
          fi
          echo "[QA] SUCCESS: Semua fitur CLI & regression check lolos!"
          echo "===================================================="

      # --- TAHAP 4: AUR HELPER (YAY) INTEGRATION TEST ---
      - name: QA Test AUR Helper Integration (yay)
        run: |
          set -uo pipefail
          echo "===================================================="
          echo "[QA] Testing AUR Helper (yay) Compatibility"
          echo "===================================================="
          YAY_URL=$(curl -sL https://api.github.com/repos/Jguer/yay/releases/latest 2>/dev/null \
            | grep -o '"browser_download_url": *"[^"]*x86_64\.pkg\.tar\.zst"' \
            | head -n1 | cut -d'"' -f4 || true)
          if [ -n "$YAY_URL" ]; then
            curl -sLo /tmp/yay.pkg.tar.zst "$YAY_URL" || true
            if [ -f /tmp/yay.pkg.tar.zst ] && [ -s /tmp/yay.pkg.tar.zst ]; then
              pacman -U --noconfirm /tmp/yay.pkg.tar.zst || true
            fi
          fi
          if command -v yay &> /dev/null; then
            yay -Qi atha || true
          fi

      # --- TAHAP 5: SAFETY LAYER & EDGE CASES TESTING ---
      - name: QA Test Safety Layer & Edge Cases
        run: |
          set -uo pipefail
          echo "===================================================="
          echo "[QA] Testing Safety Layer (Lock Handling Detection)"
          echo "===================================================="

          # Trap ini jaring pengaman untuk crash TAK TERDUGA (mis. atha doctor
          # segfault) — trap EXIT baru jalan saat SELURUH step ini selesai,
          # bukan langsung setelah `atha doctor` dipanggil. Makanya verifikasi
          # "sudah bersih" di bawah TIDAK BOLEH mengandalkan trap ini sudah
          # jalan (itu bug P1 dari Greptile: dicek sebelum trap sempat
          # eksekusi, jadi selalu gagal) — cleanup utamanya dilakukan manual
          # lewat `rm` di bawah, trap cuma cadangan.
          trap 'rm -f /var/lib/pacman/db.lck' EXIT
          touch /var/lib/pacman/db.lck

          DOCTOR_OUTPUT=$(atha doctor 2>&1 || true)
          echo "$DOCTOR_OUTPUT"

          rm -f /var/lib/pacman/db.lck

          if echo "$DOCTOR_OUTPUT" | grep -q "pacman database lock exists"; then
            echo "[PASS] atha doctor berhasil mendeteksi keberadaan db.lck"
          else
            echo "[FAIL] atha doctor gagal mendeteksi db.lck"
            exit 1
          fi

          if [ -f /var/lib/pacman/db.lck ]; then
            echo "[FAIL] db.lck masih ada setelah rm manual — sistem file bermasalah?"
            exit 1
          else
            echo "[PASS] db.lck berhasil dibersihkan"
          fi

          echo "===================================================="
          echo "[QA] SUCCESS: Comprehensive Enterprise QA Suite Passed!"
          echo "===================================================="
