name: CI (Test, Lint & Advanced Enterprise QA)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      # cargo test menjalankan unit test murni di src/main.rs (mod tests):
      # validasi nama paket, format_bytes, BuildDirGuard cleanup-on-drop, dll.
      # Ini jalan di ubuntu-latest tanpa pacman, jadi hanya mencakup logika
      # yang tidak menyentuh pacman/jaringan — sisanya diuji di job
      # qa-advanced-enterprise di bawah, yang punya pacman sungguhan.
      - name: Check, Format & Unit Test
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo test --all-targets

  qa-advanced-enterprise:
    name: QA Advanced Enterprise Test (Full Feature Parity, AUR Helper & Safety Layer)
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    env:
      # CARGO_HOME/CARGO_TARGET_DIR dibuat di /tmp dan dipakai bersama oleh root
      # maupun user "builder", sehingga dependency crate yang sudah
      # didownload/dicompile pada build pertama (cargo build --release)
      # langsung dipakai ulang saat makepkg menjalankan cargo build-nya sendiri.
      CARGO_HOME: /tmp/cargo-home
      CARGO_TARGET_DIR: /tmp/cargo-target

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            pacman-pkg-${{ runner.os }}-

      - name: Install System Dependencies
        run: |
          set -euo pipefail
          # pacman-contrib ditambahkan supaya `checkupdates` tersedia — tanpa
          # ini, `atha update --plan/--dry-run` selalu jatuh ke fallback
          # `pacman -Qu` dan jalur utamanya (checkupdates) tidak pernah teruji.
          pacman -Sy --noconfirm --needed base-devel rustup git curl wget sudo yajl pacman-contrib python

      - name: Configure Rust toolchain
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          chmod -R 0777 "$CARGO_HOME" "$CARGO_TARGET_DIR"
          rustup default stable

      - name: Cache Cargo dependencies (shared CARGO_HOME)
        uses: actions/cache@v4
        with:
          path: |
            /tmp/cargo-home/registry
            /tmp/cargo-home/git
            /tmp/cargo-target
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-

      - name: Setup Non-Root Builder User
        run: |
          set -euo pipefail
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder /__w/Atha/Atha "$CARGO_HOME" "$CARGO_TARGET_DIR"

      # --- TAHAP 1: MULTI-VECTOR INSTALLATION (5 vektor) ---
      - name: QA Test All Installation Methods
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "[QA] Starting Multi-Vector Installation Testing"
          echo "===================================================="

          # Method 1: Source build
          su - builder -c "export PATH=\$HOME/.cargo/bin:\$PATH CARGO_HOME=$CARGO_HOME CARGO_TARGET_DIR=$CARGO_TARGET_DIR && rustup default stable && cd /__w/Atha/Atha && cargo build --release --locked"
          sudo install -Dm755 "$CARGO_TARGET_DIR/release/atha" /usr/local/bin/atha

          # Method 2: Local binary install
          atha --version

          # Method 3 & 3b: curl & wget simulation via local python HTTP server
          mkdir -p /tmp/mock-releases/v3.1.1/
          cp "$CARGO_TARGET_DIR/release/atha" /tmp/mock-releases/v3.1.1/atha-x86_64-linux

          # Jalankan server HTTP lokal di port 8000
          python -m http.server 8000 --directory /tmp/mock-releases &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1

          # Uji unduh via curl
          curl -sLo /usr/local/bin/atha-curl "http://localhost:8000/v3.1.1/atha-x86_64-linux"
          chmod +x /usr/local/bin/atha-curl
          atha-curl --version

          # Uji unduh via wget
          wget -qO /usr/local/bin/atha-wget "http://localhost:8000/v3.1.1/atha-x86_64-linux"
          chmod +x /usr/local/bin/atha-wget
          atha-wget --version

          # Matikan server HTTP lokal
          kill $SERVER_PID 2>/dev/null || true

          # Method 4/5: makepkg (PKGBUILD) — juga memvalidasi source/checksum/
          # license install di PKGBUILD sungguhan
          su - builder -c "export CARGO_HOME=$CARGO_HOME CARGO_TARGET_DIR=$CARGO_TARGET_DIR && cd /__w/Atha/Atha && makepkg -si --noconfirm"
          pacman -Qi atha

          echo "[QA] All installation vectors passed!"

      # --- TAHAP 2: PACKAGING QA & DISTRIBUTION VALIDATION (NAMCAP) ---
      - name: QA Validate Package with Namcap & Lint
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "[QA] Starting Packaging & Distribution Validation (Namcap)"
          echo "===================================================="

          pacman -Sy --noconfirm --needed namcap
          PKG_FILE=$(find /__w/Atha/Atha -name "atha-*.pkg.tar.zst" ! -name "*-debug-*" | head -n1)

          if [ -f "$PKG_FILE" ]; then
            echo "[QA] Found built package: $PKG_FILE"

            echo "[QA] Running PKGBUILD lint check..."
            namcap_pkgbuild_rc=0
            namcap_pkgbuild_output="$(namcap PKGBUILD 2>&1)" \vert{}\vert{} namcap_pkgbuild_rc=$?
            echo "$namcap_pkgbuild_output"
            if echo "$namcap_pkgbuild_output" | grep -qE '(^|[[:space:]])E:[[:space:]]'; then
              echo "[QA] Namcap found PKGBUILD ERROR(S) — failing CI."
              exit 1
            fi

            echo "[QA] Running built package audit..."
            namcap_pkg_rc=0
            namcap_pkg_output="$(namcap "$PKG_FILE" 2>&1)" \vert{}\vert{} namcap_pkg_rc=$?
            echo "$namcap_pkg_output"
            if echo "$namcap_pkg_output" | grep -qE '(^|[[:space:]])E:[[:space:]]'; then
              echo "[QA] Namcap found package ERROR(S) — failing CI."
              exit 1
            fi
          else
            echo "[QA] Package file not found for namcap inspection — failing CI."
            exit 1
          fi

          echo "[QA] Packaging QA validation completed successfully!"

      # --- TAHAP 3: FULL CLI FEATURE & REGRESSION TEST SUITE ---
      - name: QA Test All CLI Commands, Modes & Known Regressions
        run: |
          set -uo pipefail
          echo "===================================================="
          echo "[QA] Full CLI Feature & Regression Test Suite"
          echo "===================================================="

          FAILED=0

          assert_success() {
            local desc="$1"; shift
            if "$@" > /tmp/assert_out.log 2>&1; then
              echo "[PASS] $desc"
            else
              echo "[FAIL] $desc (exit=$?)"
              cat /tmp/assert_out.log
              FAILED=1
            fi
          }

          assert_failure() {
            local desc="$1"; shift
            if "$@" > /tmp/assert_out.log 2>&1; then
              echo "[FAIL] $desc (seharusnya gagal, tapi sukses)"
              cat /tmp/assert_out.log
              FAILED=1
            else
              echo "[PASS] $desc (gagal seperti yang diharapkan)"
            fi
          }

          # --- Perintah dasar ---
          assert_success "atha --version" atha --version
          assert_success "atha --help" atha --help
          assert_success "atha (tanpa argumen, cetak HELP)" atha
          assert_success "atha doctor" atha doctor

          # --- list: 4 varian ---
          assert_success "atha list installed" atha list installed
          assert_success "atha list explicit" atha list explicit
          assert_success "atha list aur" atha list aur
          assert_success "atha list all --limit 5" atha list all --limit 5

          # --- info & search ---
          assert_success "atha info pacman" atha info pacman
          assert_failure "atha info dengan nama tidak valid ditolak" atha info 'bad name!'
          assert_success "atha search curl" atha search curl

          # --- install/remove/update: --plan & --dry-run ---
          assert_success "atha install --plan pacman" atha install --plan pacman
          assert_success "atha install --dry-run pacman" atha install --dry-run pacman
          assert_success "atha remove --plan non-existent-pkg-xyz" atha remove --plan non-existent-pkg-xyz
          assert_success "atha remove --dry-run non-existent-pkg-xyz" atha remove --dry-run non-existent-pkg-xyz
          assert_success "atha update --plan" atha update --plan
          assert_success "atha update --dry-run" atha update --dry-run

          # --- history: semua mode tampilan + filter ---
          assert_success "atha history --limit 5" atha history --limit 5
          assert_success "atha history --full --limit 5" atha history --full --limit 5
          assert_success "atha history --timeline --limit 5" atha history --timeline --limit 5
          assert_success "atha history --summary" atha history --summary
          assert_success "atha history --action install --limit 5" atha history --action install --limit 5
          assert_success "atha history --status success --limit 5" atha history --status success --limit 5

          echo "===================================================="
          if [ "$FAILED" -ne 0 ]; then
            echo "[QA] SATU ATAU LEBIH TEST GAGAL."
            exit 1
          fi
          echo "[QA] SUCCESS: Semua fitur CLI & regression check lolos!"
          echo "===================================================="

      # --- TAHAP 4: AUR HELPER (YAY) INTEGRATION TEST ---
      - name: QA Test AUR Helper Integration (yay)
        run: |
          set -uo pipefail
          echo "===================================================="
          echo "[QA] Testing AUR Helper (yay) Compatibility"
          echo "===================================================="
          YAY_URL=$(curl -sL https://api.github.com/repos/Jguer/yay/releases/latest 2>/dev/null \
            | grep -o '"browser_download_url": *"[^"]*x86_64\.pkg\.tar\.zst"' \
            | head -n1 | cut -d'"' -f4 || true)
          if [ -n "$YAY_URL" ]; then
            curl -sLo /tmp/yay.pkg.tar.zst "$YAY_URL" || true
            if [ -f /tmp/yay.pkg.tar.zst ] && [ -s /tmp/yay.pkg.tar.zst ]; then
              pacman -U --noconfirm /tmp/yay.pkg.tar.zst || true
            fi
          fi
          if command -v yay &> /dev/null; then
            yay -Qi atha || true
          fi

      # --- TAHAP 5: SAFETY LAYER & EDGE CASES TESTING ---
      - name: QA Test Safety Layer & Edge Cases
        run: |
          set -uo pipefail
          echo "===================================================="
          echo "[QA] Testing Safety Layer (Lock Handling)"
          echo "===================================================="
          trap 'rm -f /var/lib/pacman/db.lck' EXIT
          touch /var/lib/pacman/db.lck
          atha doctor || true
          if [ -f /var/lib/pacman/db.lck ]; then
            echo "[FAIL] db.lck masih ada setelah atha doctor"
            exit 1
          fi
          echo "[PASS] db.lck ditangani dengan baik dan dibersihkan"
          echo "===================================================="
          echo "[QA] SUCCESS: Comprehensive Enterprise QA Suite Passed!"
          echo "===================================================="
