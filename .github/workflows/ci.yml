name: CI (Test, Lint & Advanced Enterprise QA)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

# Batalkan run lama yang masih berjalan di branch/PR yang sama saat ada push baru,
# supaya tidak buang-buang runner minutes untuk commit yang sudah usang.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Check and test
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo test --all-targets

  qa-advanced-enterprise:
    name: QA Advanced Enterprise Test (AUR Helper & Safety Layer)
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: archlinux:latest
    env:
      # CARGO_HOME/CARGO_TARGET_DIR dibuat di /tmp dan dipakai bersama oleh root
      # maupun user "builder" (lihat step "Setup Non-Root Builder User"), sehingga
      # dependency crate yang sudah didownload/dicompile pada build pertama
      # (cargo build --release) langsung dipakai ulang saat makepkg menjalankan
      # cargo build-nya sendiri. Ini menghilangkan kompilasi dependency dua kali.
      CARGO_HOME: /tmp/cargo-home
      CARGO_TARGET_DIR: /tmp/cargo-target

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Cache paket pacman (base-devel, git, curl, wget, sudo, yajl) supaya
      # tidak didownload ulang dari mirror setiap run. Key mengikuti daftar
      # paket + tanggal(minggu) agar cache tetap segar.
      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            pacman-pkg-${{ runner.os }}-

      - name: Install System Dependencies
        run: |
          set -euo pipefail
          # "go" dihapus dari daftar: yay sekarang diinstal dari paket rilis
          # .pkg.tar.zst yang sudah dikompilasi (lihat step AUR Helper), jadi
          # toolchain Go untuk build yay dari source tidak lagi dibutuhkan.
          pacman -Sy --noconfirm --needed base-devel rustup git curl wget sudo yajl

      - name: Configure Rust toolchain
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          chmod -R 0777 "$CARGO_HOME" "$CARGO_TARGET_DIR"
          rustup default stable

      # Cache dependency Cargo (bukan hasil build) berdasarkan Cargo.lock, agar
      # `cargo build --release` maupun build internal makepkg tidak mendownload
      # ulang crates.io index & sources dari nol tiap run.
      - name: Cache Cargo dependencies (shared CARGO_HOME)
        uses: actions/cache@v4
        with:
          path: |
            /tmp/cargo-home/registry
            /tmp/cargo-home/git
            /tmp/cargo-target
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-

      - name: Setup Non-Root Builder User
        run: |
          set -euo pipefail
          useradd -m builder
          # Tidak perlu "passwd -d builder": `su - builder` yang dijalankan
          # sebagai root tidak memerlukan password target user, jadi men-set
          # password kosong hanya menambah attack surface tanpa manfaat.
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder /__w/Atha/Atha "$CARGO_HOME" "$CARGO_TARGET_DIR"

      # --- TAHAP 1: MULTI-VECTOR INSTALLATION ---
      - name: QA Test All Installation Methods
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "[QA] Starting Multi-Vector Installation Testing"
          echo "===================================================="

          # Method 1 & 2: Source & Binary.
          # --locked: gagal cepat & deterministik kalau Cargo.lock tidak sinkron,
          # daripada diam-diam resolve ulang dependency (lebih lambat & tidak reproducible).
          su - builder -c "export PATH=\$HOME/.cargo/bin:\$PATH CARGO_HOME=$CARGO_HOME CARGO_TARGET_DIR=$CARGO_TARGET_DIR && rustup default stable && cd /__w/Atha/Atha && cargo build --release --locked"
          sudo install -Dm755 "$CARGO_TARGET_DIR/release/atha" /usr/local/bin/atha
          atha --version

          # Method 3: curl / wget simulation
          mkdir -p /tmp/mock-releases/v3.1.1/
          cp "$CARGO_TARGET_DIR/release/atha" /tmp/mock-releases/v3.1.1/atha-x86_64-linux
          curl -sLo /usr/local/bin/atha-curl "file:///tmp/mock-releases/v3.1.1/atha-x86_64-linux"
          chmod +x /usr/local/bin/atha-curl
          atha-curl --version

          # Method 4: makepkg (PKGBUILD). Karena CARGO_HOME/CARGO_TARGET_DIR sudah
          # berisi dependency & artifact dari build di atas, cargo build di dalam
          # makepkg seharusnya hanya perlu relink binary atha, bukan compile ulang
          # seluruh dependency tree.
          su - builder -c "export CARGO_HOME=$CARGO_HOME CARGO_TARGET_DIR=$CARGO_TARGET_DIR && cd /__w/Atha/Atha && makepkg -si --noconfirm"

          echo "[QA] All basic installation vectors passed!"

      # --- TAHAP 2: PACKAGING QA & DISTRIBUTION VALIDATION ---
      - name: QA Validate Package with Namcap & Lint
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "[QA] Starting Packaging & Distribution Validation (Namcap)"
          echo "===================================================="

          # Install namcap untuk audit kualitas paket Arch Linux
          pacman -Sy --noconfirm --needed namcap

          # Cari file paket hasil makepkg (.pkg.tar.zst) di direktori kerja
          PKG_FILE=$(find /__w/Atha/Atha -name "atha-*.pkg.tar.zst" | head -n1)

          if [ -f "$PKG_FILE" ]; then
            echo "[QA] Found built package: $PKG_FILE"
            
            echo "[QA] Running PKGBUILD lint check..."
            namcap PKGBUILD || echo "[QA] Namcap PKGBUILD notices found (non-fatal)."

            echo "[QA] Running built package audit..."
            namcap "$PKG_FILE" || echo "[QA] Namcap package audit notices found (non-fatal)."
          else
            echo "[QA] Warning: Package file not found for namcap inspection."
          fi

          echo "[QA] Packaging QA validation completed successfully!"

      # --- TAHAP 3: AUR HELPER (YAY) WORKFLOW INTEGRATION TEST ---
      - name: QA Test AUR Helper Integration (yay)
        run: |
          set -uo pipefail
          echo "===================================================="
          echo "[QA] Testing AUR Helper (yay) Compatibility"
          echo "===================================================="

          # Coba unduh binary yay dari rilis resminya dengan aman
          YAY_URL=$(curl -sL https://api.github.com/repos/Jguer/yay/releases/latest 2>/dev/null \
            | grep -o '"browser_download_url": *"[^"]*x86_64\.pkg\.tar\.zst"' \
            | head -n1 | cut -d'"' -f4 || true)

          if [ -n "$YAY_URL" ]; then
            echo "[QA] Downloading yay from: $YAY_URL"
            curl -sLo /tmp/yay.pkg.tar.zst "$YAY_URL" || true
            if [ -f /tmp/yay.pkg.tar.zst ] && [ -s /tmp/yay.pkg.tar.zst ]; then
              pacman -U --noconfirm /tmp/yay.pkg.tar.zst || true
            fi
          fi

          # Verifikasi keberadaan yay, jika gagal kita berikan catatan tanpa membuat seluruh CI gagal
          if command -v yay &> /dev/null; then
            echo "[QA] yay is installed successfully. Testing package query..."
            yay -Qi atha || echo "[QA] Note: atha is installed via local makepkg, verifying registry..."
          else
            echo "[QA] Notice: yay binary not installed, skipping auxiliary helper check gracefully."
          fi

      # --- TAHAP 4: SAFETY LAYER & EDGE CASES TESTING ---
      - name: QA Test Safety Layer & Edge Cases
        run: |
          set -uo pipefail   # tanpa -e: kegagalan tiap sub-test ditangani manual di bawah
          echo "===================================================="
          echo "[QA] Testing Safety Layer (--dry-run, --plan, & Lock Handling)"
          echo "===================================================="

          echo "[Safety Test 1] Testing install --dry-run..."
          atha install --dry-run pacman || echo "[Safety Test 1] Handled gracefully"

          echo "[Safety Test 2] Testing remove --plan..."
          atha remove --plan non-existent-pkg || echo "[Safety Test 2] Handled gracefully"

          echo "[Safety Test 3] Testing update --dry-run..."
          atha update --dry-run || echo "[Safety Test 3] Handled gracefully"

          echo "[Safety Test 4] Testing behavior under simulated pacman db.lck..."
          # trap memastikan db.lck SELALU dibersihkan, walaupun `atha doctor`
          # crash tak terduga — sebelumnya rm hanya jalan kalau baris di atasnya
          # selesai normal.
          trap 'rm -f /var/lib/pacman/db.lck' EXIT
          touch /var/lib/pacman/db.lck
          atha doctor || true

          echo "===================================================="
          echo "[QA] SUCCESS: Advanced Enterprise QA Suite Passed!"
          echo "===================================================="