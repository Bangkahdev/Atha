name: CD (Build Release & Publish to AUR)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  

jobs:
  build-and-release:
    name: Build & Verify Linux Binary, Publish to GitHub Release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm --needed base-devel rustup git

      - name: Configure Rust toolchain
        run: |
          set -euo pipefail
          rustup default stable

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Tag name kosong setelah strip 'v' prefix"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "[CD] Building release for version: $VERSION"

      - name: Build release binary
        run: |
          set -euo pipefail
          cargo build --release --locked

      # PAGAR UTAMA: Validasi ketat biner x86_64 ELF Linux (mendukung standar maupun PIE executable)
      - name: Verify binary is a genuine x86_64 Linux ELF executable
        run: |
          set -euo pipefail
          FILE_INFO="$(file target/release/atha)"
          echo "$FILE_INFO"
          if ! echo "$FILE_INFO" | grep -Eq 'ELF 64-bit LSB (pie )?executable, x86-64'; then
            echo "::error::Binary bukan x86_64 ELF Linux yang valid (dapat: $FILE_INFO). Membatalkan rilis."
            exit 1
          fi
          echo "[CD] Verified: biner adalah x86_64 ELF Linux yang valid."

      - name: Rename binary for release asset
        run: |
          set -euo pipefail
          cp target/release/atha atha-x86_64-linux

      - name: Compute sha256 checksum
        id: checksum
        run: |
          set -euo pipefail
          SUM="$(sha256sum atha-x86_64-linux | awk '{print $1}')"
          echo "[CD] sha256: $SUM"
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"

      # Pin action release ke commit SHA resmi untuk keamanan supply-chain
      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@c95fe148c366fe419b136fc1b7d8c0f21fc6c9f9 # v2.2.1
        with:
          files: atha-x86_64-linux
          fail_on_unmatched_files: true

  aur-publish:
    name: Publish to AUR
    needs: build-and-release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      VERSION: ${{ needs.build-and-release.outputs.version }}
      SHA256: ${{ needs.build-and-release.outputs.sha256 }}
    steps:
      - name: Install pacman dependencies
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm --needed base-devel rustup git openssh sudo python

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix Workspace Permissions
        run: |
          set -euo pipefail
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Setup SSH for AUR
        shell: su - builder -c "bash {0}"
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur_id_rsa
          chmod 600 ~/.ssh/aur_id_rsa
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

          git config --global user.name "Bangkah"
          git config --global user.email "bangkah@aur.archlinux.org"
          git config --global --add safe.directory '*'

          cat << EOF > ~/.ssh/config
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_id_rsa
            User aur
          EOF

      - name: Generate .SRCINFO & Sync to AUR
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          if [ -z "$VERSION" ] || [ -z "$SHA256" ]; then
            echo "::error::VERSION atau SHA256 kosong — membatalkan publish AUR."
            exit 1
          fi

          echo "[CD] Publishing PKGBUILD for version=$VERSION sha256=$SHA256"

          sudo -u builder VERSION="$VERSION" SHA256="$SHA256" WORKSPACE="$WORKSPACE" bash -c '
            set -euo pipefail
            cd "$WORKSPACE"

            # Gunakan Python untuk memperbarui pkgver, pkgrel, dan multiline sha256sums secara aman
            python3 -c "
            import os, re
            ver = os.environ[\x27VERSION\x27]
            sha = os.environ[\x27SHA256\x27]
            
            with open(\x27PKGBUILD\x27, \x27r\x27) as f:
                content = f.read()
                
            content = re.sub(r\x27^pkgver=.*$\x27, f\x27pkgver={ver}\x27, content, flags=re.MULTILINE)
            content = re.sub(r\x27^pkgrel=.*$\x27, \x27pkgrel=1\x27, content, flags=re.MULTILINE)
            content = re.sub(r\x27sha256sums=\\(.*?\\)\x27, f\x27sha56sums=(\x27{sha}\x27 \x27SKIP\x27)\x27 if \x27sha56sums\x27 in content else f\x27sha256sums=(\x27{sha}\x27 \x27SKIP\x27)\x27, content, flags=re.DOTALL)
            # Pastikan regex sha256sums menangani ejaan standar
            content = re.sub(r\x27sha256sums=\\(.*?\\)\x27, f\x27sha256sums=(\x27{sha}\x27 \x27SKIP\x27)\x27, content, flags=re.DOTALL)
            
            with open(\x27PKGBUILD\x27, \x27w\x27) as f:
                f.write(content)
            "

            grep -q "pkgver=$VERSION" PKGBUILD
            grep -q "$SHA256" PKGBUILD

            makepkg --printsrcinfo > .SRCINFO

            git clone ssh://aur@aur.archlinux.org/atha.git /tmp/aur-atha
            cp PKGBUILD /tmp/aur-atha/
            cp .SRCINFO /tmp/aur-atha/

            cd /tmp/aur-atha
            git add PKGBUILD .SRCINFO
            git commit -m "maint: release version $VERSION" || echo "No changes to commit"
            git push origin master
          '
